{{- if not .Values.secrets.existingSecret }}
{{- /* Generated values are read back from the cluster on upgrade, so they never change. */}}
{{- $existing := (lookup "v1" "Secret" .Release.Namespace (include "portal.name" .)).data | default dict }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "portal.name" . }}
  labels: {{ include "portal.labels" . | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
type: Opaque
data:
  django-secret-key: {{ if .Values.secrets.djangoSecretKey }}{{ .Values.secrets.djangoSecretKey | b64enc }}{{ else }}{{ index $existing "django-secret-key" | default (randAlphaNum 64 | b64enc) }}{{ end }}
  postgres-password: {{ if .Values.secrets.postgresPassword }}{{ .Values.secrets.postgresPassword | b64enc }}{{ else }}{{ index $existing "postgres-password" | default (randAlphaNum 32 | b64enc) }}{{ end }}
  oidc-client-secret: {{ .Values.secrets.oidcClientSecret | b64enc | quote }}
  email-password: {{ .Values.secrets.emailPassword | b64enc | quote }}
{{- end }}
