{% extends "base.html" %}
{% block title %}Change password{% endblock %}
{% block main_class %}narrow{% endblock %}
{% block content %}
<h1>Change password</h1>
<form method="post" class="panel stack">
  {% csrf_token %}
  {% for field in form %}
    {% include "changes/_field.html" with field=field wide=True %}
  {% endfor %}
  <div><button class="button primary">Change password</button></div>
</form>
{% endblock %}
