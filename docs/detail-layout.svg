<text x='930' y='198' font-size='13' fill='#111827' font-weight='normal' text-anchor='start'>Upgrade firmware on the two core switches in</text>
<text x='930' y='220' font-size='13' fill='#111827' font-weight='normal' text-anchor='start'>Bldg 400 from 17.6.4 to 17.9.5 to address the</text>
<text x='930' y='242' font-size='13' fill='#111827' font-weight='normal' text-anchor='start'>vendor security advisory. Work is done in the</text>
<text x='930' y='264' font-size='13' fill='#111827' font-weight='normal' text-anchor='start'>Saturday maintenance window, one switch at a</text>
<text x='930' y='286' font-size='13' fill='#111827' font-weight='normal' text-anchor='start'>time, so the stack stays up throughout. Each</text>
<text x='930' y='308' font-size='13' fill='#111827' font-weight='normal' text-anchor='start'>switch reloads once (about 8 minutes). Config is</text>
<text x='930' y='330' font-size='13' fill='#111827' font-weight='normal' text-anchor='start'>backed up to the NMS before the upgrade, and the</text>
<text x='930' y='352' font-size='13' fill='#111827' font-weight='normal' text-anchor='start'>rollback is a reload to the previous image ...</text>
